name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore H2Sharp.sln

      - name: Build
        run: dotnet build H2Sharp.sln --configuration Release --no-restore

      # The differential tests live in the same assembly and skip here, because this job
      # has neither the reference checkout nor a JDK. That is fine for a build gate but
      # it is NOT evidence of Java compatibility: see the conformance job, which is the
      # only place that actually compares against the reference implementation.
      - name: Test
        run: dotnet test H2Sharp.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results

  conformance:
    name: Differential conformance vs reference H2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The reference must be the pinned revision, not master. Cloning master would let
      # the oracle drift underneath the tests, which shows up as a mysterious failure (or,
      # worse, a false pass) with nothing in the log saying the reference had moved.
      - name: Checkout reference H2 at the pinned revision
        run: |
          set -euo pipefail
          test -f reference/H2_COMMIT.txt
          rev="$(tr -d '[:space:]' < reference/H2_COMMIT.txt)"
          git clone -q https://github.com/h2database/h2database.git reference/h2
          git -C reference/h2 fetch -q --depth 1 origin "$rev"
          git -C reference/h2 checkout -q FETCH_HEAD
          echo "reference/h2 pinned at $rev"

      - name: Build reference H2 jar
        working-directory: reference/h2/h2
        run: mvn -B -q -DskipTests package

      - name: Restore
        run: dotnet restore H2Sharp.sln

      # H2SHARP_REQUIRE_ORACLE turns an unusable oracle from a silent skip into a
      # failure. Without it a broken checkout, a missing jar or a wrong reference root
      # would report zero differential coverage as a green run.
      - name: Conformance tests
        env:
          H2SHARP_REQUIRE_ORACLE: '1'
          H2SHARP_REFERENCE_ROOT: ${{ github.workspace }}/reference/h2
        run: >
          dotnet test tests/H2Sharp.Tests/H2Sharp.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=conformance.trx"
          --results-directory artifacts/conformance

      # Util/CaseFolding.cs is a snapshot of one JVM's Unicode tables crossed with one
      # .NET runtime's tables, and nothing else in the build notices when either moves.
      # Regenerating and diffing turns that silence into a red build.
      - name: Generated tables are in sync with the reference
        run: python tools/regen.py --check

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: artifacts/conformance
